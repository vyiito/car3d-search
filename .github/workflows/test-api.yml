name: Validate search API

on:
  push:
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/test-api.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/search.js
      - run: node --check src/providers.js
      - run: node --check src/vertex-adapter.js
      - run: node --check src/brasil-adapter.js
      - run: node --check src/3dsky-adapter.js
      - run: node --check src/vosan-adapter.js
      - run: node --check src/overtake-adapter.js
      - run: node --check src/market-adapters.js
      - run: node --check src/catalog-adapters.js
      - run: node --check src/remaining-adapters.js
      - name: Vertex regression · Funco F9
        run: |
          node --input-type=module <<'EOF'
          import { searchVertexNative } from './src/vertex-adapter.js'
          const payload = await searchVertexNative('2018 Funco Motorsports F9', 20)
          const hit = payload.results.find(item => /funco\s+motorsports\s+f9/i.test(item.title))
          console.log(JSON.stringify({ pagesFetched: payload.pagesFetched, count: payload.results.length, hit }, null, 2))
          if (!hit) process.exit(1)
          if (hit.game !== 'Forza Horizon 5') process.exit(1)
          EOF
      - name: New source adapter diagnostics
        continue-on-error: true
        run: |
          node --input-type=module <<'EOF'
          import { searchNativeMarketSources } from './src/market-adapters.js'
          import { search3DBaza, searchWireWheels } from './src/catalog-adapters.js'
          import { searchCGMoodV2, searchZifir, searchRenderHub, search3ddd, search3dCar } from './src/remaining-adapters.js'
          const base = await searchNativeMarketSources('Toyota', 8)
          const tests = [
            ['3D-Baza', () => search3DBaza('Toyota', 8)],
            ['Wire Wheels', () => searchWireWheels('Ford', 8)],
            ['CGMood V2', () => searchCGMoodV2('Toyota', 8)],
            ['ZIFIR', () => searchZifir('Toyota', 8)],
            ['RenderHub', () => searchRenderHub('Toyota', 8)],
            ['3ddd', () => search3ddd('Toyota Camry', 8)],
            ['3DCar', () => search3dCar('Honda NSX', 8)],
          ]
          console.log('BASE', JSON.stringify(base.map(x => ({source:x.sourceId,status:x.status,count:x.results.length,pages:x.pagesFetched,error:x.error})), null, 2))
          for (const [name, fn] of tests) {
            try {
              const value = await fn()
              console.log(name, JSON.stringify({count:value.results.length,pages:value.pagesFetched,first:value.results[0]?.title||null,error:value.error||null}, null, 2))
            } catch (error) {
              console.log(name, JSON.stringify({count:0,pages:0,error:error.message}, null, 2))
            }
          }
          EOF
