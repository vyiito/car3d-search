name: Validate search API

on:
  push:
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/test-api.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/search.js
      - run: node --check src/providers.js
      - run: node --check src/vertex-adapter.js
      - run: node --check src/brasil-adapter.js
      - run: node --check src/3dsky-adapter.js
      - run: node --check src/vosan-adapter.js
      - run: node --check src/overtake-adapter.js
      - run: node --check src/market-adapters.js
      - run: node --check src/catalog-adapters.js
      - run: node --check src/remaining-adapters.js
      - run: node --check src/commerce-adapters.js
      - run: node --check src/cgtrader-adapter.js
      - run: node --check src/reference-adapter.js
      - name: Vertex regression · Funco F9
        run: |
          node --input-type=module <<'EOF'
          import { searchVertexNative } from './src/vertex-adapter.js'
          const payload = await searchVertexNative('2018 Funco Motorsports F9', 20)
          const hit = payload.results.find(item => /funco\s+motorsports\s+f9/i.test(item.title))
          console.log(JSON.stringify({ pagesFetched: payload.pagesFetched, count: payload.results.length, hit }, null, 2))
          if (!hit || hit.game !== 'Forza Horizon 5') process.exit(1)
          EOF
      - name: Core new source diagnostics
        continue-on-error: true
        run: |
          node --input-type=module <<'EOF'
          import { searchNativeMarketSources } from './src/market-adapters.js'
          import { search3DBaza, searchWireWheels } from './src/catalog-adapters.js'
          import { searchCGMoodV2, searchZifir, search3ddd } from './src/remaining-adapters.js'
          const base = await searchNativeMarketSources('Toyota', 8)
          const tests = [
            ['3D-Baza', () => search3DBaza('Toyota', 8)],
            ['Wire Wheels', () => searchWireWheels('Ford', 8)],
            ['CGMood V2', () => searchCGMoodV2('Toyota', 8)],
            ['ZIFIR', () => searchZifir('Toyota', 8)],
            ['3ddd', () => search3ddd('Toyota Camry', 8)],
          ]
          console.log('BASE', JSON.stringify(base.map(x => ({source:x.sourceId,status:x.status,count:x.results.length,pages:x.pagesFetched,error:x.error})), null, 2))
          for (const [name, fn] of tests) {
            try {
              const value = await fn()
              console.log(name, JSON.stringify({count:value.results.length,pages:value.pagesFetched,first:value.results[0]?.title||null,error:value.error||null}, null, 2))
            } catch (error) {
              console.log(name, JSON.stringify({count:0,pages:0,error:error.message}, null, 2))
            }
          }
          EOF
      - name: Reference pack + ZIP diagnostic
        continue-on-error: true
        run: |
          node --input-type=module <<'EOF'
          import { searchReferencePack, buildReferenceZip } from './src/reference-adapter.js'
          const pack = await searchReferencePack({ title: 'Toyota Supra MK4', brand: 'Toyota', year: 1998 }, { perAngle: 2 })
          const selected = pack.images.filter(image => image.downloadAllowed).slice(0, 3).map(image => image.id)
          let zip = null
          if (selected.length) zip = await buildReferenceZip(pack.packId, selected)
          console.log(JSON.stringify({ query: pack.query, images: pack.images.length, downloadable: pack.downloadableCount, angles: pack.angleCoverage, zipBytes: zip?.buffer?.length || 0, zipIncluded: zip?.included || 0, zipName: zip?.filename || null }, null, 2))
          EOF
      - name: Commerce adapter diagnostics
        continue-on-error: true
        run: |
          node --input-type=module <<'EOF'
          import { searchCGTraderMarketV2 } from './src/cgtrader-adapter.js'
          import { searchRenderHubClean, search3dCarClean } from './src/commerce-adapters.js'
          const [cg, render, gallery] = await Promise.all([
            searchCGTraderMarketV2('Toyota Supra', 12),
            searchRenderHubClean('Toyota', 12),
            search3dCarClean('Honda NSX', 12),
          ])
          const paid = cg.results.find(item => item.isFree === false || (typeof item.price === 'number' && item.price > 0))
          const renderBad = render.results.find(item => /^✓|extended use license|high poly.*game ready/i.test(item.title))
          const nsx = gallery.results.find(item => /honda\s+nsx/i.test(item.title))
          console.log('CGTRADER', JSON.stringify({count:cg.results.length,pages:cg.pagesFetched,paid:paid ? {title:paid.title,price:paid.price} : null}, null, 2))
          console.log('RENDERHUB', JSON.stringify({count:render.results.length,pages:render.pagesFetched,first:render.results[0]?.title||null,badTitle:renderBad?.title||null}, null, 2))
          console.log('3DCAR', JSON.stringify({count:gallery.results.length,pages:gallery.pagesFetched,nsx:nsx?.title||null}, null, 2))
          if (!cg.results.length || !paid) process.exit(1)
          if (renderBad) process.exit(1)
          if (!nsx) process.exit(1)
          EOF
