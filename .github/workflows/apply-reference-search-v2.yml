name: Apply reference search v2

on:
  push:
    paths:
      - 'scripts/apply-reference-search-v2.mjs'
      - '.github/workflows/apply-reference-search-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reference search changes
        run: node scripts/apply-reference-search-v2.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/reference-adapter.js
          git commit -m "feat: broaden real-car reference discovery"
          git push
